# ============================================================
# PyTeXMK 项目配置文件示例 (.pytexmkrc)
# 全部为可选配置；缺失时使用内置默认值静默运行。
# 本文件由 `pytexmk -i` 生成；已存在时需配合 `-f` 才会覆盖。
# ============================================================

# 主文件名（不包含扩展名）
default_file = "main"

# 编译器：XeLaTeX / PdfLaTeX / LuaLaTeX
compiled_program = "XeLaTeX"

# 安静模式（true 表示编译过程不在终端显示日志）
quiet_mode = true

# ---- 目录 ------------------------------------------------------
[folder]
auxdir = "./Auxiliary/"   # 辅助文件目录
outdir = "./Build/"       # 输出 PDF 目录

# ---- PDF 预览 --------------------------------------------------
[pdf]
pdf_preview_status = false  # 编译结束后是否打开 PDF
pdf_viewer = "default"      # default 为默认阅读器

# ---- 索引 ------------------------------------------------------
[index]
index_style_file = "nomencl.ist"  # 输入样式文件
input_suffix = ".nlo"             # 输入文件后缀
output_suffix = ".nls"            # 输出文件后缀

# ---- LaTeXDiff -------------------------------------------------
[latexdiff]
old_tex_file = "old_file"
new_tex_file = "new_file"
diff_tex_file = "LaTeXDiff"

# ---- 子项目清单（由 pytexmk -ls 自动托管） ---------------------
# 无需手写，`pytexmk -ls` 会扫描并整体替换本段（含手写内容）。
# 支持格式：name = "相对路径"
# 例如：
# [subprojects]
# "Cover" = "Cover"
# "Review" = "Review"

# ---- 子项目发现规则（以根配置为准，-ls/-s 不修改本段） ---------
# [project_scan]
# depth = 3        # 最大扫描深度
# exclude = []     # 额外排除的目录名（覆盖默认排除清单之外的自定义项）