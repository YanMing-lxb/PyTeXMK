[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pytexmk"
dynamic = ["version"]
authors = [
  { name = "焱铭", email = "lxb-yanming@foxmail.com" },
]
description = "LaTeX 辅助编译命令行工具 LaTeX Auxiliary Compilation Command Line Tool"
keywords = ["LaTeX", "build", "latexmk"]
dependencies = [
    "packaging>=26.2",
    "platformdirs>=4.11.0",
    "pypdf>=6.14.2",
    "pytexlogs>=0.1.0",
    "rich>=15.0.0",
    "rich_argparse>=1.8.0",
    "tomli-w>=1.2.0",
]

readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/YanMing-lxb/PyTeXMK"
"Bug Tracker" = "https://github.com/YanMing-lxb/PyTeXMK/issues"

[project.scripts]
pytexmk = "pytexmk:main"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
publish-url = "https://pypi.org/project/pytexmk"
default = true

[dependency-groups]
dev = [
    "cython>=3.2.9",
    "pillow>=11.0.0",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
]

[tool.setuptools.dynamic]
version = {attr = "pytexmk.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pytexmk*"]
namespaces = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# 根包：locale .mo 文件（中/英未来可扩展为 **）+ data 目录兜底
"pytexmk" = [
    "locale/en/LC_MESSAGES/*.mo",
    "locale/**/*.mo",
    "locale/**/*.pot",
    "data/README.html",
    "data/*.toml",
]
# 子包 pytexmk.data：data 目录下实际所有需要分发的资源
"pytexmk.data" = [
    "README.html",
    "*.toml",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001", "S112", "DTZ005", "PLW1510"]
"scripts/*" = ["BLE001", "S112", "DTZ005", "PLW1510"]
"tests/test.py" = ["BLE001", "S112", "DTZ005", "PLW1510"]
"tests/test_tr21_manager_compare.py" = ["BLE001", "S112", "DTZ005", "PLW1510"]
"tests/test_tr22_register_compat.py" = ["BLE001", "S112", "DTZ005", "PLW1510"]
"scripts/check_log_decouple.py" = ["BLE001", "S112", "DTZ005", "PLW1510"]
