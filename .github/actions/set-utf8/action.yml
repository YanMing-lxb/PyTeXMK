# 将 Windows runner 设置到 UTF-8 代码页，并持久化 UTF-8 环境变量。
# 供多个 job 复用（build-binary、publish-to-winget 均需处理中文输出）。
# 主要动作：
#   1) chcp 65001 + 设置当前 shell 的 Console 输入/输出编码；
#   2) 把 PYTHONUTF8 / PYTHONIOENCODING 写入 GITHUB_ENV，供后续所有 step 继承。
name: Set Windows UTF-8 codepage
description: Configure the Windows runner console and env to UTF-8

inputs: {}

runs:
  using: composite
  steps:
    - name: Set UTF-8 codepage and persist envs
      shell: pwsh
      run: |
        chcp 65001
        [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
        [Console]::InputEncoding  = [System.Text.UTF8Encoding]::new($false)
        $OutputEncoding           = [System.Text.UTF8Encoding]::new($false)
        $env:PYTHONUTF8           = "1"
        $env:PYTHONIOENCODING     = "utf-8:replace"
        "PYTHONUTF8=1" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
        "PYTHONIOENCODING=utf-8:replace" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
        chcp