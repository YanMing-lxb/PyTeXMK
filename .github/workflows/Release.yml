name: Release PyTeXMK

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (build only, NO publishing to PyPI/GitHub Release)'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  build-binary:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            bin_path: ./dist/pytexmk/pytexmk
          - os: windows-latest
            platform: windows
            bin_path: ./dist/pytexmk/pytexmk.exe
          - os: macos-latest
            platform: macos
            bin_path: ./dist/pytexmk/pytexmk
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Pack binary (onedir, Cython)
        run: uv run python tools/pack.py pack

      - name: Test binary
        run: ${{ matrix.bin_path }} --help

      - name: Get version
        id: version
        run: |
          version=$(uv run python -c "import re; f=open('src/pytexmk/version.py', encoding='utf-8').read(); m=re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]', f); print(m.group(1) if m else '')")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare release zip (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          version="${{ steps.version.outputs.version }}"
          platform="${{ matrix.platform }}"
          zip_name="pytexmk-${version}-${platform}-x64.zip"
          rm -f "$zip_name"
          (cd dist && zip -r "../$zip_name" pytexmk/)
          ls -la "$zip_name"

      - name: Prepare release zip (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $platform = "${{ matrix.platform }}"
          $zipName = "pytexmk-$version-$platform-x64.zip"
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          if (Test-Path staging_pack) { Remove-Item staging_pack -Recurse -Force }
          New-Item -ItemType Directory -Path staging_pack -Force | Out-Null
          Copy-Item -Path "dist\pytexmk" -Destination "staging_pack\pytexmk" -Recurse
          Push-Location staging_pack
          Compress-Archive -Path "pytexmk" -DestinationPath "..\$zipName"
          Pop-Location
          Remove-Item staging_pack -Recurse -Force
          Write-Host "Created zip: $zipName"
          Get-ChildItem $zipName | Select-Object Name, Length

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pytexmk-binary-${{ matrix.os }}
          path: pytexmk-*.zip

  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Build package
        run: uv build

      - name: Upload package artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/
            CHANGELOG.md

  publish-to-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    needs: build-package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pytexmk
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: List dist directory contents
        run: ls -R dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          packages-dir: dist/

  publish-to-github-release:
    name: Publish to GitHub Release
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    needs: [build-binary, build-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download package distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pytexmk-binary-*
          path: dist/
          merge-multiple: true

      - name: List dist directory contents
        run: ls -R dist/

      - name: Extract tag name
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Generate Changelog
        run: |
          changelog=$(cat CHANGELOG.md)
          tag_name=${{ env.TAG_NAME }}
          version_header="## $tag_name"
          version_content=""
          if [[ $changelog == *"$version_header"* ]]; then
            version_content=$(echo "$changelog" | awk -v version_header="$version_header" '
              /^## / { if (p) exit; p=0 }
              $0 ~ version_header { p=1; next }
              p')
            echo "$version_content"
          else
            echo "Version $tag_name not found in CHANGELOG.md"
          fi
          echo "$version_content" > CHANGELOG.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          body_path: CHANGELOG.txt
          token: ${{ secrets.PUBLISH_PYTEXMK }}
          name: PyTeXMK ${{ github.ref_name }}
          files: dist/*
          draft: false
          prerelease: false
