# =============================================================================
# PyTeXMK Release 工作流
# -----------------------------------------------------------------------------
# 产物与发布渠道总览（打包产物只构建一次，无重复打包步骤）：
#
#   [build-binary]        → 三平台 PyInstaller onedir 可执行 + 打 zip
#       └─ windows zip    → 作为 winget 的安装源（GitHub Release 资产 URL）
#   [build-package]       → sdist + wheel（pip/PyPI 源码与二进制发行）
#   [publish-to-pypi]     → 把 sdist+wheel 发布到 PyPI
#   [publish-to-github-release] → 把「sdist+wheel + 三平台 zip」一并发到 GitHub Release
#   [publish-to-winget]   → 引用 GitHub Release 上的 windows zip URL，
#                          用官方 wingetcreate 下载算 SHA、生成 en-US 清单、
#                          校验并提交 PR 到 microsoft/winget-pkgs（不重复打包）
#
# 打包是否冗余：build-binary 产二进制 zip，build-package 产可 pip 安装的
# sdist/wheel，两者是不同形态的发行物（二进制 vs 源码/纯 pip），不是同一件事
# 的两个副本；GitHub Release 同时附带两者是有意为之。winget job 不再本地打包，
# 直接按 URL 引用已经传好的 windows zip。
# =============================================================================

name: Release PyTeXMK

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (build only, NO publishing to PyPI/GitHub Release)'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

# 防重复发布：以 ref（tag 或分支）作为并发组键。
# 同一 tag/分支被多次触发（如重复 push tag、手动连点 Run workflow）时，
# 新触发会先取消仍在进行的旧触发，避免同一版本并行跑两套全量 Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # JOB: build-binary —— 三平台编译可执行二进制并打发布 zip
  # 产物: dist/pytexmk/（onedir 目录）+ pytexmk-<version>-<platform>-x64.zip
  # 关键: 仅此一处编译二进制；windows 平台的 zip 会被 winget 作为安装源。
  # ---------------------------------------------------------------------------
  build-binary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            bin_path: ./dist/pytexmk/pytexmk
          - os: windows-latest
            platform: windows
            bin_path: ./dist/pytexmk/pytexmk.exe
          - os: macos-latest
            platform: macos
            bin_path: ./dist/pytexmk/pytexmk
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Windows runner 默认代码页非 UTF-8，PyTeXMK 输出含中文，务必切到 UTF-8。
      # 复用本地 composite action（.github/actions/set-utf8），与 winget job 保持一致。
      - name: Set Windows runner to UTF-8 codepage
        if: runner.os == 'Windows'
        uses: ./.github/actions/set-utf8

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: "pyproject.toml"

      # --all-extras --dev: 编译二进制需要完整的运行/构建/开发依赖树
      # （与普通开发环境一致，保证 PyInstaller 能收集到全部动态依赖）。
      - name: Install dependencies
        shell: bash
        run: uv sync --locked --all-extras --dev

      # 纯诊断输出：确认本机编译器/Python/uv/PyInstaller 版本，便于排查打包问题。
      - name: Show versions for diagnostics
        shell: bash
        run: |
          echo "--- Compiler ---"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cl.exe 2>&1 | head -n 3 || true
          elif [ "${{ runner.os }}" = "Linux" ]; then
            gcc -v 2>&1 | tail -n 1 || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            clang -v 2>&1 | tail -n 1 || true
          fi
          echo "--- Python ---"
          python --version
          echo "--- uv ---"
          uv --version
          echo "--- PyInstaller ---"
          pyinstaller --version 2>&1 || true

      # 唯一的二进制编译入口：PyInstaller onedir 模式 → dist/pytexmk/。
      - name: Pack binary (onedir, source mode)
        timeout-minutes: 120
        run: uv run python tools/pack.py pack

      # 非 Windows：二进制冒烟测试（--version / --help）。
      - name: Test binary
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 10
        run: ${{ matrix.bin_path }} --version && ${{ matrix.bin_path }} --help >/dev/null

      # Windows：前面的 set-utf8 step 已配置 UTF-8 代码页与环境变量，
      # 这里只需执行冒烟测试（--version / --help），防止中文输出乱码导致的假失败。
      - name: Test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          & "${{ matrix.bin_path }}" --version
          & "${{ matrix.bin_path }}" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Binary smoke test failed, exit=$LASTEXITCODE" }

      # 把已打包的 dist/pytexmk/ 目录压成 <package>-<ver>-<platform>-x64.zip。
      # 只做压缩，不重新编译（zip_release.py 仅拷贝已生成的 onedir）。
      # Windows 平台的这个 zip 就是 winget 清单里的安装源 URL。
      - name: Prepare release zip
        shell: bash
        timeout-minutes: 10
        run: uv run python tools/zip_release.py ${{ matrix.platform }}

      # 上传 zip 为 artifact，供 publish-to-github-release 汇总发布，
      # 也便于 winget job 之后的阶段按需取用。
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pytexmk-binary-${{ matrix.os }}
          path: pytexmk-*.zip

  # ---------------------------------------------------------------------------
  # JOB: build-package —— 构建 pip 发行包（sdist + wheel）
  # 产物: dist/*(whl + tar.gz)。它喂给两个下游：PyPI 发布 + GitHub Release 源码附赠。
  # ---------------------------------------------------------------------------
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      # uv build → 一次性产出 sdist(.tar.gz) 与 wheel(.whl)。
      - name: Build package
        run: uv build

      - name: Upload package artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  # ---------------------------------------------------------------------------
  # JOB: publish-to-pypi —— 发布到 PyPI
  # 仅在打 tag 且非 dry_run 时运行；用 Trusted Publishing（id-token）免 token。
  # ---------------------------------------------------------------------------
  publish-to-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    needs: build-package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pytexmk
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          packages-dir: dist/

  # ---------------------------------------------------------------------------
  # JOB: publish-to-github-release —— 汇总并发布 GitHub Release
  # 拉取「sdist+wheel」与「三平台二进制 zip」，一起挂到 v<version> 的 Release 上。
  # 这是 winget 安装源的发布者（windows zip 在这里被传上去）。
  # ---------------------------------------------------------------------------
  publish-to-github-release:
    name: Publish to GitHub Release
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    needs: [build-binary, build-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 拉取 pip 发行包（sdist+wheel），用于附在 Release 上。
      - name: Download package distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      # 拉取三平台二进制 zip，合并进同一个 dist/ 目录。
      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pytexmk-binary-*
          path: dist/
          merge-multiple: true

      # 从 git ref 的 "refs/tags/v1.2.2" 解析出纯版本 tag "v1.2.2"。
      - name: Extract tag name
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      # 从 CHANGELOG.md 里按 "## v1.2.2" 标题抽取对应版本的发布说明。
      - name: Generate Changelog
        run: |
          changelog=$(cat CHANGELOG.md)
          tag_name=${{ env.TAG_NAME }}
          version_header="## $tag_name"
          version_content=""
          if [[ $changelog == *"$version_header"* ]]; then
            version_content=$(echo "$changelog" | awk -v version_header="$version_header" '
              /^## / { if (p) exit; p=0 }
              $0 ~ version_header { p=1; next }
              p')
            echo "$version_content"
          else
            echo "Version $tag_name not found in CHANGELOG.md"
          fi
          echo "$version_content" > CHANGELOG.txt

      # 创建 GitHub Release：上传 sdist+wheel+三平台 zip，附上文/更新说明。
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          body_path: CHANGELOG.txt
          token: ${{ secrets.PUBLISH_PYTEXMK }}
          name: PyTeXMK ${{ github.ref_name }}
          files: dist/*
          draft: false
          prerelease: false

  # ---------------------------------------------------------------------------
  # JOB: publish-to-winget —— 官方 wingetcreate 发布到 microsoft/winget-pkgs
  # 流程：不重新打包，也不跑本地脚本。直接用 curl 下载官方 wingetcreate，
  #       再以内联命令完成 下载→算 SHA→生成 en-US 清单→校验→提交 PR。
  # 关键取舍：不使用 continue-on-error —— winget 发布失败会让整个 workflow 红标，
  #          确保发布问题能立即暴露（首次需人工审核合并，但提交失败必须可见）。
  # 令牌：secrets.WINGET_GITHUB_TOKEN → 注入为 WINGET_CREATE_GITHUB_TOKEN 环境变量
  #       （wingetcreate 的标准读取变量），token 永不进命令行、不打日志。
  # 依赖：needs [build-binary, publish-to-github-release] 保证 windows zip 已上传
  #       （--urls 指向的资产必然存在），否则 URL 无有效资产可下载。
  # 版本号：tag 触发时 github.ref_name 即 v<version>，剥离前导 v 即为版本号；
  #       与 src/pytexmk/version.py（config.__version__）保持一致的前提是
  #       make upload 以 v<version> 打 tag（既有约定），无需重复配置。
  # ---------------------------------------------------------------------------
  publish-to-winget:
    name: Publish to WinGet
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    needs: [build-binary, publish-to-github-release]
    permissions:
      contents: read
      pull-requests: write   # wingetcreate 以 token 向 winget-pkgs 提交 PR 需要
    timeout-minutes: 15
    env:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
    steps:
      # 由 tag 推导版本与安装源 URL（内联实现，不需要 checkout/uv/python）。
      - name: Derive version and installer URL
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME          # 例如 v1.2.3
          $ver = $tag.Substring(1)             # 剥离前导 v -> 1.2.3
          "PACKAGE_ID=YanMing-lxb.PyTeXMK" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          "PACKAGE_VERSION=$ver" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          "INSTALLER_URL=https://github.com/YanMing-lxb/PyTeXMK/releases/download/$tag/pytexmk-$ver-windows-x64.zip" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          Write-Host "Release tag: $tag"
          Write-Host "Installer URL: https://github.com/YanMing-lxb/PyTeXMK/releases/download/$tag/pytexmk-$ver-windows-x64.zip"

      # 下载官方 wingetcreate（微软 aka.ms 地址，附带 wingetcreate.exe）。
      - name: Download wingetcreate
        shell: pwsh
        run: curl.exe -JLO https://aka.ms/wingetcreate/latest

      # 真正的 winget 发布：内联执行 wingetcreate update --submit。
      # 包不存在（首次发布）时 update 会失败：new 是交互式向导，CI 无人值守跑不通，
      # 因此这里打印首次手动发布指引并抛错使 job 红标。首次清单入库后，
      # 后续版本均由 update 全自动发布。
      - name: Submit package to winget-pkgs
        shell: pwsh
        run: |
          .\wingetcreate.exe update $env:PACKAGE_ID --version $env:PACKAGE_VERSION --urls $env:INSTALLER_URL --submit
          if ($LASTEXITCODE -ne 0) {
            Write-Host "首次发布：包尚未入库，CI 无法无人值守执行交互式 new。"
            Write-Host "请手动执行 wingetcreate new 并按 docs/winget_publish.md 完成首次提交与人工审核；"
            Write-Host "首次清单入库后，后续版本由本 job 自动 update。"
            throw "winget update 失败, exit=$LASTEXITCODE"
          }