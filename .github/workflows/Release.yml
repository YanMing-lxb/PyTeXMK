# =============================================================================
# PyTeXMK Release 工作流
# -----------------------------------------------------------------------------
# 产物与发布渠道总览（打包产物只构建一次，无重复打包步骤）：
#
#   [build-binary]        → Windows(x64) / macOS(arm64) 的 PyInstaller onedir 可执行 + 打 zip
#       └─ windows zip    → 作为 winget 的安装源（GitHub Release 资产 URL）
#   [build-binary-linux]  → Linux(x64) 可执行 + 打 zip，固定 manylinux_2_28 容器构建
#   [smoke-linux-artifact] → 在 Rocky Linux 8（glibc 2.28）里真跑一次产物，验证水位承诺
#   [build-package]       → sdist + wheel（pip/PyPI 源码与二进制发行）
#   [release-gate]        → 构建、smoke、winget fork/包存在性、Release token 全部预检
#   [publish-to-github-release] → 把「sdist+wheel + 三平台 zip」一并发到 GitHub Release
#   [publish-to-winget]   → 引用 GitHub Release 上的 windows zip URL，
#                          用官方 wingetcreate 下载算 SHA、生成 en-US 清单、
#                          校验并提交 PR 到 microsoft/winget-pkgs（不重复打包）
#   [publish-to-pypi]     → 最后才把 sdist+wheel 发布到 PyPI（版本不可覆盖）
#
# 二进制资产的架构取舍（与 tools/install.sh 的映射严格一致）：
#   linux-x64    manylinux_2_28 容器构建 → 依赖 glibc ≤ 2.28，
#                覆盖 Ubuntu 20.04+ / Debian 10+ / RHEL 8+（不受 runner 升级影响）
#   macos-arm64  macos-26 runner（arm64）→ Apple Silicon；Intel Mac 走 uv 通道
#   windows-x64  windows-latest runner
# Linux 走容器的原因：ubuntu-latest 随 GitHub 升级发行版（已迁 26.04 / glibc 2.43），
# 直接用它编译会把产物 glibc 水位被动抬高；容器把"构建环境"与"最低可运行发行版"
# 绑定，并由 check_glibc.py 做硬门禁，水位一变就让 CI 红，而不是让用户报错。
#
# 打包是否冗余：build-binary(-linux) 产二进制 zip，build-package 产可 pip 安装的
# sdist/wheel，两者是不同形态的发行物（二进制 vs 源码/纯 pip），不是同一件事
# 的两个副本；GitHub Release 同时附带两者是有意为之。winget job 不再本地打包，
# 直接按 URL 引用已经传好的 windows zip。
# =============================================================================

name: Release PyTeXMK

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (build only, NO publishing to PyPI/GitHub Release)'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

# 防重复发布：以 ref（tag 或分支）作为并发组键。
# 同一 tag/分支被多次触发（如重复 push tag、手动连点 Run workflow）时，
# 新触发会先取消仍在进行的旧触发，避免同一版本并行跑两套全量 Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # JOB: build-binary-linux —— 在 manylinux_2_28 容器里编译 Linux 二进制并打 zip
  # 产物: dist/pytexmk/（onedir 目录）+ pytexmk-<version>-linux-x64.zip
  # 基底: AlmaLinux 8 / glibc 2.28，镜像自带 CPython 3.9–3.15 与 binutils。
  # 门禁: check_glibc.py 断言产物（含 _internal 里捆绑的 .so）不超过 2.28。
  # ---------------------------------------------------------------------------
  build-binary-linux:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 180
    steps:
      # 镜像不保证带 git（checkout 依赖它）；objdump 缺失则 glibc 门禁无法运行，也补上。
      - name: Ensure git and binutils in the container
        shell: bash
        run: |
          command -v git >/dev/null 2>&1 || dnf install -y git
          command -v objdump >/dev/null 2>&1 || dnf install -y binutils

      - name: Checkout
        uses: actions/checkout@v7

      # 用镜像自带的 CPython 3.15 安装 uv；随后改用 uv 管理的 CPython 3.15。
      # 镜像自带的 cp315 是无共享库的静态构建，PyInstaller 需要 libpython.so，
      # 会直接报 "Python was built without a shared library"。
      - name: Set up uv on the image CPython 3.15
        shell: bash
        run: |
          /opt/python/cp315-cp315/bin/python -m pip install --upgrade uv
          echo "/opt/python/cp315-cp315/bin" >> "$GITHUB_PATH"
          uv python install 3.15

      - name: Show versions for diagnostics
        shell: bash
        run: |
          echo "--- glibc ---"
          ldd --version 2>&1 | awk 'NR==1'
          echo "--- Python ---"
          python --version
          echo "--- uv ---"
          uv --version
          echo "--- gcc ---"
          gcc -dumpfullversion -dumpversion 2>&1 || true

      # --dev：编译二进制需要完整的运行/构建/开发依赖树。
      # UV_PYTHON 指向 uv 管理的 3.15（带共享库），而不是镜像里的静态 cp315。
      - name: Install dependencies
        shell: bash
        env:
          UV_PYTHON: "3.15"
        run: uv sync --locked --dev

      # 显式确保 PyInstaller 进入项目环境；不依赖 dev 组在容器内的解析结果。
      - name: Ensure PyInstaller
        shell: bash
        run: uv pip install 'pyinstaller>=6.22.3'

      # 唯一的 Linux 二进制编译入口：PyInstaller onedir 模式 → dist/pytexmk/。
      - name: Pack binary (onedir, source mode)
        shell: bash
        timeout-minutes: 120
        run: uv run python tools/pack.py pack

      # 水位门禁：产物要求高于 glibc 2.28 就直接失败，不把问题留给用户。
      - name: Assert glibc floor <= 2.28
        shell: bash
        run: uv run python tools/check_glibc.py 2.28 dist/pytexmk

      - name: Test binary
        shell: bash
        timeout-minutes: 10
        run: ./dist/pytexmk/pytexmk --version && ./dist/pytexmk/pytexmk --help >/dev/null

      # 回归探针：外部程序（TeX 引擎）拿到的 LD_LIBRARY_PATH 不得含打包目录，
      # 否则 lualatex 会优先加载 _internal 里的 libssl/libcrypto 而报 OPENSSL_3.2.0。
      # 用假引擎把环境变量回写到文件，不依赖真实 LaTeX 发行版。
      - name: Regression - external programs get a clean library path
        shell: bash
        timeout-minutes: 10
        run: |
          set -u
          BIN="$PWD/dist/pytexmk/pytexmk"
          mkdir -p /tmp/probe/bin /tmp/probe/proj
          for eng in lualatex xelatex pdflatex latex dvipdfmx biber bibtex makeindex latexmk; do
            printf '#!/bin/sh\necho "LD_LIBRARY_PATH=${LD_LIBRARY_PATH-<unset>}" >> /tmp/probe/env.txt\nexit 0\n' > "/tmp/probe/bin/$eng"
            chmod +x "/tmp/probe/bin/$eng"
          done
          printf '%% !TEX program = LuaLaTeX\n\\documentclass{article}\n\\begin{document}probe\\end{document}\n' > /tmp/probe/proj/main.tex
          rm -f /tmp/probe/env.txt
          ( cd /tmp/probe/proj && PATH="/tmp/probe/bin:$PATH" "$BIN" > /tmp/probe/run.log 2>&1 ) || true
          if [ ! -s /tmp/probe/env.txt ]; then
            echo "✗ 探针未触发任何外部程序，无法判定环境是否被污染"
            tail -n 20 /tmp/probe/run.log || true
            exit 1
          fi
          if grep -q '_internal' /tmp/probe/env.txt; then
            echo "✗ 外部程序继承了打包目录的库路径："
            sort -u /tmp/probe/env.txt
            exit 1
          fi
          echo "✓ 外部程序的 LD_LIBRARY_PATH 不含打包目录"

      # 把已打包的 dist/pytexmk/ 压成 pytexmk-<ver>-linux-x64.zip（只压缩，不重新编译）。
      - name: Prepare release zip
        shell: bash
        timeout-minutes: 10
        run: uv run python tools/zip_release.py linux --arch x64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pytexmk-binary-linux
          path: pytexmk-*.zip

  # ---------------------------------------------------------------------------
  # JOB: smoke-linux-artifact —— 在真实 glibc 2.28 环境里跑一遍产物
  # check_glibc.py 只校验符号水位；这里用 Rocky Linux 8（glibc 2.28）真跑一次，
  # 验证"我们声称能跑的最老环境"确实能启动，而不是只靠符号推断。
  # ---------------------------------------------------------------------------
  smoke-linux-artifact:
    name: Smoke test Linux binary on glibc 2.28
    needs: build-binary-linux
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8
    timeout-minutes: 15
    steps:
      - name: Install unzip
        shell: bash
        run: dnf install -y --setopt=install_weak_deps=False unzip

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: pytexmk-binary-linux
          path: /tmp/artifact

      - name: Run the packaged binary
        shell: bash
        run: |
          cd /tmp/artifact
          unzip -q pytexmk-*.zip -d extracted
          echo "--- runtime glibc ---"
          ldd --version 2>&1 | awk 'NR==1'
          ./extracted/pytexmk/pytexmk --version

  # ---------------------------------------------------------------------------
  # JOB: build-binary —— Windows(x64) 与 macOS(arm64) 编译并打发布 zip
  # 产物: dist/pytexmk/（onedir 目录）+ pytexmk-<version>-<platform>-<arch>.zip
  # 关键: Windows 的 zip 会被 winget 作为安装源；macOS 只发 arm64（Intel 走 uv）。
  # ---------------------------------------------------------------------------
  build-binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            bin_path: ./dist/pytexmk/pytexmk.exe
          - os: macos-26          # arm64 runner；macOS 二进制只发 arm64
            platform: macos
            arch: arm64
            bin_path: ./dist/pytexmk/pytexmk
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Windows runner 默认代码页非 UTF-8，PyTeXMK 输出含中文，务必切到 UTF-8。
      # 复用本地 composite action（.github/actions/set-utf8），与 winget job 保持一致。
      - name: Set Windows runner to UTF-8 codepage
        if: runner.os == 'Windows'
        uses: ./.github/actions/set-utf8

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python 3.15
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true   # 3.15 若仍是预发布版，setup-python 需要这一项才能装

      # --dev：编译二进制需要完整的运行/构建/开发依赖树
      # （与普通开发环境一致，保证 PyInstaller 能收集到全部动态依赖）。
      - name: Install dependencies
        shell: bash
        run: uv sync --locked --dev

      # 纯诊断输出：确认本机编译器/Python/uv/PyInstaller 版本，便于排查打包问题。
      - name: Show versions for diagnostics
        shell: bash
        run: |
          echo "--- Compiler ---"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cl.exe 2>&1 | head -n 3 || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            clang -v 2>&1 | tail -n 1 || true
          fi
          echo "--- Python ---"
          python --version
          echo "--- uv ---"
          uv --version
          echo "--- PyInstaller ---"
          pyinstaller --version 2>&1 || true

      # 唯一的二进制编译入口：PyInstaller onedir 模式 → dist/pytexmk/。
      - name: Pack binary (onedir, source mode)
        timeout-minutes: 120
        run: uv run python tools/pack.py pack

      # 非 Windows：二进制冒烟测试（--version / --help）。
      - name: Test binary
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 10
        run: ${{ matrix.bin_path }} --version && ${{ matrix.bin_path }} --help >/dev/null

      # Windows：前面的 set-utf8 step 已配置 UTF-8 代码页与环境变量，
      # 这里只需执行冒烟测试（--version / --help），防止中文输出乱码导致的假失败。
      - name: Test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          & "${{ matrix.bin_path }}" --version
          & "${{ matrix.bin_path }}" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Binary smoke test failed, exit=$LASTEXITCODE" }

      # macOS 只发 arm64：产物架构必须与资产命名一致，否则 users 会装到"名不副实"的包。
      - name: Assert macOS binary is arm64
        if: runner.os == 'macOS'
        shell: bash
        run: |
          file dist/pytexmk/pytexmk | tee /dev/stderr | grep -q 'arm64' || {
            echo "✗ 产物不是 arm64 架构，检查 runner 与 PyInstaller 目标架构"
            exit 1
          }

      # 把已打包的 dist/pytexmk/ 目录压成 <package>-<ver>-<platform>-<arch>.zip。
      # 只做压缩，不重新编译（zip_release.py 仅拷贝已生成的 onedir）。
      # Windows 平台的这个 zip 就是 winget 清单里的安装源 URL。
      - name: Prepare release zip
        shell: bash
        timeout-minutes: 10
        run: uv run python tools/zip_release.py ${{ matrix.platform }} --arch ${{ matrix.arch }}

      # 上传 zip 为 artifact，供 publish-to-github-release 汇总发布，
      # 也便于 winget job 之后的阶段按需取用。
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pytexmk-binary-${{ matrix.os }}
          path: pytexmk-*.zip

  # ---------------------------------------------------------------------------
  # JOB: build-package —— 构建 pip 发行包（sdist + wheel）
  # 产物: dist/*(whl + tar.gz)。它喂给两个下游：PyPI 发布 + GitHub Release 源码附赠。
  # ---------------------------------------------------------------------------
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python 3.15
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true   # 3.15 若仍是预发布版，setup-python 需要这一项才能装

      - name: Install dependencies
        run: uv sync --locked

      # uv build → 一次性产出 sdist(.tar.gz) 与 wheel(.whl)。
      - name: Build package
        run: uv build

      - name: Upload package artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  # ---------------------------------------------------------------------------
  # JOB: release-gate —— 所有可失败的构建/冒烟检查通过后，才允许发布
  # PyPI 与 GitHub Release 都必须依赖它；任何一个二进制或 glibc smoke 失败，
  # 都不会产生新的 PyPI 版本，避免“CI 修一次、PyPI 多一个版本”。
  # ---------------------------------------------------------------------------
  release-gate:
    name: Release gate
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    needs: [build-package, build-binary, build-binary-linux, smoke-linux-artifact]
    runs-on: ubuntu-latest
    env:
      WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
      PUBLISH_PYTEXMK: ${{ secrets.PUBLISH_PYTEXMK }}
    steps:
      - name: Confirm all release artifacts passed
        run: |
          echo "package / windows / macos / linux / glibc-2.28 smoke all passed"

      # winget 的前置条件必须在任何渠道发布前检查：
      # fork 未同步时，wingetcreate update --submit 会在 PR 阶段失败；如果等到
      # GitHub Release/PyPI 发完才发现，就只能靠再发一个版本来修。
      - name: Check winget / GitHub release prerequisites
        shell: bash
        run: |
          set -euo pipefail
          api() {
            curl -fsS \
              -H "Authorization: Bearer ${WINGET_GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$@"
          }
          if [ -z "${WINGET_GITHUB_TOKEN:-}" ]; then
            echo "::error::WINGET_GITHUB_TOKEN 未配置，无法提交 winget"
            exit 1
          fi
          if [ -z "${PUBLISH_PYTEXMK:-}" ]; then
            echo "::error::PUBLISH_PYTEXMK 未配置，无法创建 GitHub Release"
            exit 1
          fi

          fork_owner=$(api https://api.github.com/user | jq -r .login)
          curl -fsS \
            -H "Authorization: Bearer ${PUBLISH_PYTEXMK}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" >/dev/null \
            || { echo "::error::PUBLISH_PYTEXMK 无权访问 ${GITHUB_REPOSITORY}"; exit 1; }

          # 先确认 winget-pkgs 中确实存在该包；否则不是 update 能解决的场景。
          api "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/y/YanMing-lxb/PyTeXMK" >/dev/null \
            || { echo "::error::YanMing-lxb.PyTeXMK 尚未入库，不能走自动 update"; exit 1; }

          # 对齐 fork 的 master 与上游 master。上游会持续合并 PR，因此先尝试
          # GitHub 官方 merge-upstream 快进；若 fork 有本地提交导致冲突，则失败。
          for _ in 1 2 3; do
            upstream_sha=$(api https://api.github.com/repos/microsoft/winget-pkgs/commits/master | jq -r .sha)
            fork_sha=$(api "https://api.github.com/repos/${fork_owner}/winget-pkgs/commits/master" | jq -r .sha)
            [ "$upstream_sha" = "$fork_sha" ] && break
            echo "winget fork 落后于上游，尝试同步 ${fork_owner}/winget-pkgs:master"
            api -X POST \
              -H "Content-Type: application/json" \
              -d '{"branch":"master"}' \
              "https://api.github.com/repos/${fork_owner}/winget-pkgs/merge-upstream" >/dev/null \
              || { echo "::error::winget fork 同步失败；请手动 Sync fork 后重试"; exit 1; }
            sleep 2
          done
          upstream_sha=$(api https://api.github.com/repos/microsoft/winget-pkgs/commits/master | jq -r .sha)
          fork_sha=$(api "https://api.github.com/repos/${fork_owner}/winget-pkgs/commits/master" | jq -r .sha)
          if [ "$upstream_sha" != "$fork_sha" ]; then
            echo "::error::winget fork 仍与上游不一致；请手动 Sync fork 后重试"
            exit 1
          fi
          echo "winget fork 已与 microsoft/winget-pkgs:master 对齐"

  # ---------------------------------------------------------------------------
  # JOB: publish-to-pypi —— 发布到 PyPI
  # 在 release-gate、GitHub Release、WinGet 都成功后再运行；先确保三平台二进制、
  # Release 资产和 winget 提交都已成功，最后才把不可覆盖的 PyPI 版本号发出去。
  # ---------------------------------------------------------------------------
  publish-to-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    needs: [release-gate, publish-to-github-release, publish-to-winget]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pytexmk
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          packages-dir: dist/

  # ---------------------------------------------------------------------------
  # JOB: publish-to-github-release —— 汇总并发布 GitHub Release
  # 拉取「sdist+wheel」与「三平台二进制 zip」，一起挂到 v<version> 的 Release 上。
  # 这是 winget 安装源的发布者（windows zip 在这里被传上去）。
  # ---------------------------------------------------------------------------
  publish-to-github-release:
    name: Publish to GitHub Release
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 拉取 pip 发行包（sdist+wheel），用于附在 Release 上。
      - name: Download package distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      # 拉取三平台二进制 zip，合并进同一个 dist/ 目录。
      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pytexmk-binary-*
          path: dist/
          merge-multiple: true

      # 从 git ref 的 "refs/tags/v1.2.2" 解析出纯版本 tag "v1.2.2"。
      - name: Extract tag name
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      # 从 CHANGELOG.md 里按 "## v1.2.2" 标题抽取对应版本的发布说明。
      - name: Generate Changelog
        run: |
          changelog=$(cat CHANGELOG.md)
          tag_name=${{ env.TAG_NAME }}
          version_header="## $tag_name"
          version_content=""
          if [[ $changelog == *"$version_header"* ]]; then
            version_content=$(echo "$changelog" | awk -v version_header="$version_header" '
              /^## / { if (p) exit; p=0 }
              $0 ~ version_header { p=1; next }
              p')
            echo "$version_content"
          else
            echo "Version $tag_name not found in CHANGELOG.md"
          fi
          echo "$version_content" > CHANGELOG.txt

      # 创建 GitHub Release：上传 sdist+wheel+三平台 zip，附上文/更新说明。
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          body_path: CHANGELOG.txt
          token: ${{ secrets.PUBLISH_PYTEXMK }}
          name: PyTeXMK ${{ github.ref_name }}
          files: dist/*
          draft: false
          prerelease: false

  # ---------------------------------------------------------------------------
  # JOB: publish-to-winget —— 官方 wingetcreate 发布到 microsoft/winget-pkgs
  # 流程：不重新打包，也不跑本地脚本。直接用 curl 下载官方 wingetcreate，
  #       再以内联命令完成 下载→算 SHA→生成 en-US 清单→校验→提交 PR。
  # 关键取舍：不使用 continue-on-error —— winget 失败会使 PyPI 发布被跳过；
  #           release-gate 已先检查 fork 同步与包存在性，失败后只需修 fork 并
  #           重跑同一 tag，不再消耗新的 PyPI 版本号。
  # 令牌：secrets.WINGET_GITHUB_TOKEN → 注入为 WINGET_CREATE_GITHUB_TOKEN 环境变量
  #       （wingetcreate 的标准读取变量），token 永不进命令行、不打日志。
  # 依赖：needs [build-binary, publish-to-github-release] 保证 windows zip 已上传
  #       （--urls 指向的资产必然存在），否则 URL 无有效资产可下载。
  # 版本号：tag 触发时 github.ref_name 即 v<version>，剥离前导 v 即为版本号；
  #       与 src/pytexmk/version.py（config.__version__）保持一致的前提是
  #       make upload 以 v<version> 打 tag（既有约定），无需重复配置。
  # ---------------------------------------------------------------------------
  publish-to-winget:
    name: Publish to WinGet
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    needs: [build-binary, publish-to-github-release]
    permissions:
      contents: read
      pull-requests: write   # wingetcreate 以 token 向 winget-pkgs 提交 PR 需要
    timeout-minutes: 15
    env:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
    steps:
      # 由 tag 推导版本与安装源 URL（内联实现，不需要 checkout/uv/python）。
      - name: Derive version and installer URL
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME          # 例如 v1.2.3
          $ver = $tag.Substring(1)             # 剥离前导 v -> 1.2.3
          "PACKAGE_ID=YanMing-lxb.PyTeXMK" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          "PACKAGE_VERSION=$ver" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          "INSTALLER_URL=https://github.com/YanMing-lxb/PyTeXMK/releases/download/$tag/pytexmk-$ver-windows-x64.zip" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          Write-Host "Release tag: $tag"
          Write-Host "Installer URL: https://github.com/YanMing-lxb/PyTeXMK/releases/download/$tag/pytexmk-$ver-windows-x64.zip"

      # 下载官方 wingetcreate（微软 aka.ms 地址，附带 wingetcreate.exe）。
      - name: Download wingetcreate
        shell: pwsh
        run: curl.exe -JLO https://aka.ms/wingetcreate/latest

      # 真正的 winget 发布：内联执行 wingetcreate update --submit。
      # 包不存在（首次发布）时 update 会失败：new 是交互式向导，CI 无人值守跑不通，
      # 因此这里打印首次手动发布指引并抛错使 job 红标。首次清单入库后，
      # 后续版本均由 update 全自动发布。
      - name: Submit package to winget-pkgs
        shell: pwsh
        run: |
          .\wingetcreate.exe update $env:PACKAGE_ID --version $env:PACKAGE_VERSION --urls $env:INSTALLER_URL --submit
          if ($LASTEXITCODE -ne 0) {
            Write-Host "wingetcreate update 失败, exit=$LASTEXITCODE"
            Write-Host "若日志包含 'The forked repository could not be synced'：包已入库，失败发生在 PR 提交阶段。"
            Write-Host "请先手动 Sync fork（${env:GITHUB_REPOSITORY_OWNER}/winget-pkgs），再重跑本 job；不要执行 wingetcreate new。"
            Write-Host "只有确认包确实尚未入库时，才按 docs/winget_publish.md 执行 wingetcreate new。"
            throw "winget update 失败, exit=$LASTEXITCODE"
          }