name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-binary:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            bin_path: ./dist/pytexmk/pytexmk
          - os: windows-latest
            platform: windows
            bin_path: ./dist/pytexmk/pytexmk.exe
          - os: macos-latest
            platform: macos
            bin_path: ./dist/pytexmk/pytexmk
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Pack binary (onedir, Cython)
        run: uv run python tools/pack.py pack

      - name: Test binary
        run: ${{ matrix.bin_path }} --help

      - name: Upload binary directory (for testing)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pytexmk-binary-${{ matrix.os }}
          path: dist/pytexmk
          retention-days: 7

  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Build package
        run: uv build

      - name: Upload package artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/
