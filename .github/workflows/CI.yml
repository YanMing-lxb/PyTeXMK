name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-binary:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            bin_path: ./dist/pytexmk/pytexmk
          - os: windows-latest
            platform: windows
            bin_path: ./dist/pytexmk/pytexmk.exe
          - os: macos-latest
            platform: macos
            bin_path: ./dist/pytexmk/pytexmk
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Windows runner to UTF-8 codepage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          chcp 65001
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::InputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8:replace"
          "PYTHONUTF8=1" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          "PYTHONIOENCODING=utf-8:replace" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          chcp
          echo "PYTHONUTF8=$env:PYTHONUTF8"
          echo "PYTHONIOENCODING=$env:PYTHONIOENCODING"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python 3.15
        # requires-python = ">=3.15"：显式钉住 3.15，避免解释器解析漂到更新的小版本
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true   # 3.15 若仍是预发布版，setup-python 需要这一项才能装

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint (ruff, target-version=py315)
        run: uv run --with ruff ruff check src tools tests

      - name: Run unit tests (pytest on 3.15)
        # 失败回显全部警告：3.15 的 DeprecationWarning 是我们的迁移哨兵
        run: uv run pytest -q -W default

      - name: Pack binary (onedir, source mode)
        run: uv run python tools/pack.py pack

      - name: Test binary
        if: runner.os != 'Windows'
        run: ${{ matrix.bin_path }} --help

      - name: Test binary (Windows — UTF-8 codepage explicitly)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          chcp 65001
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::InputEncoding  = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding         = [System.Text.UTF8Encoding]::new($false)
          $env:PYTHONUTF8           = '1'
          $env:PYTHONIOENCODING     = 'utf-8:replace'
          & "${{ matrix.bin_path }}" --help
          if ($LASTEXITCODE -ne 0) { throw "Binary smoke test failed, exit=$LASTEXITCODE" }

      - name: Prepare release zip
        run: uv run python tools/zip_release.py ${{ matrix.platform }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pytexmk-binary-${{ matrix.os }}
          path: pytexmk-*.zip
          retention-days: 7
