name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  tex-e2e:
    # 真实 TeX 端到端：单测用假引擎，这里至少保证“原生目录构建 + 投稿包”在真
    # XeLaTeX/pdflatex 上跑得通（C1/C6/3.7/3.9 的回归网）。
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended biber

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python 3.15
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Native build + submission pack (real TeX)
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          cd "$WORK"
          cat > main.tex <<'TEX'
          \documentclass{article}
          \usepackage{amsmath}
          \begin{document}
          \section{Intro}\label{sec:intro}
          See \ref{sec:intro}. Unicode: α ≤ β, 25°C, café.
          \end{document}
          TEX
          uv run --project "$GITHUB_WORKSPACE" pytexmk main -f
          test -f Build/main.pdf
          test ! -e main.aux
          uv run --project "$GITHUB_WORKSPACE" pytexmk main -f -sp
          test -f Submission/main-submission.zip
          UNPACKED="$(mktemp -d)"
          unzip -q Submission/main-submission.zip -d "$UNPACKED"
          cd "$UNPACKED"
          grep -Fq '\ensuremath{\alpha}' main.tex
          uv run --project "$GITHUB_WORKSPACE" pytexmk main -p -f
          test -s Build/main.pdf

  build-binary:
    strategy:
      # 单平台失败不再取消其余平台：避免一台机器挂掉后，另外两台被连带取消、
      # 看不到真实的跨平台结果。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            bin_path: ./dist/pytexmk/pytexmk
          - os: windows-latest
            platform: windows
            arch: x64
            bin_path: ./dist/pytexmk/pytexmk.exe
          - os: macos-latest
            platform: macos
            arch: arm64        # macos-latest 是 arm64 runner，资产命名必须与架构一致
            bin_path: ./dist/pytexmk/pytexmk
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Windows runner to UTF-8 codepage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          chcp 65001
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::InputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8:replace"
          "PYTHONUTF8=1" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          "PYTHONIOENCODING=utf-8:replace" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          chcp
          echo "PYTHONUTF8=$env:PYTHONUTF8"
          echo "PYTHONIOENCODING=$env:PYTHONIOENCODING"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python 3.15
        # requires-python = ">=3.15"：显式钉住 3.15，避免解释器解析漂到更新的小版本
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true   # 3.15 若仍是预发布版，setup-python 需要这一项才能装

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint (ruff, target-version=py315)
        run: uv run --with ruff ruff check src tools tests

      - name: Run unit tests (pytest on 3.15)
        # 失败回显全部警告：3.15 的 DeprecationWarning 是我们的迁移哨兵
        run: uv run pytest -q -W default

      - name: Pack binary (onedir, source mode)
        run: uv run python tools/pack.py pack

      - name: Test binary
        if: runner.os != 'Windows'
        run: ${{ matrix.bin_path }} --help

      - name: Test binary (Windows — UTF-8 codepage explicitly)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          chcp 65001
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::InputEncoding  = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding         = [System.Text.UTF8Encoding]::new($false)
          $env:PYTHONUTF8           = '1'
          $env:PYTHONIOENCODING     = 'utf-8:replace'
          & "${{ matrix.bin_path }}" --help
          if ($LASTEXITCODE -ne 0) { throw "Binary smoke test failed, exit=$LASTEXITCODE" }

      - name: Prepare release zip
        run: uv run python tools/zip_release.py ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pytexmk-binary-${{ matrix.os }}
          path: pytexmk-*.zip
          retention-days: 7
